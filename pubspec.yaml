name: punto_y_coma
description: PuntoYcoma — descanso seguro en transporte público.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  http: ^1.3.0
  go_router: ^14.2.0
  google_maps_flutter: ^2.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Familia única de la app, empaquetada localmente (licencia OFL, tomada del
  # repo google/fonts). Variable: un solo archivo cubre los pesos 200–800.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_wght.ttf
        - asset: assets/fonts/PlusJakartaSans_Italic_wght.ttf
          style: italic
